server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Serve pre-compressed files if available
    gzip_static on;

    # /admin/* — sin cache, headers de seguridad estrictos
    # El panel admin siempre requiere conexión (NetworkOnly en SW también)
    location ^~ /admin {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header X-XSS-Protection "1; mode=block";
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
    }

    # SPA fallback — todas las rutas no-admin → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker: no cache (always fresh)
    location ~* (sw\.js|workbox-.+\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Static assets: cache 1 year (Vite adds content hash to filenames)
    location ~* \.(?:js|css|woff2|svg|ico|png|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers globales (zona participantes)
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
